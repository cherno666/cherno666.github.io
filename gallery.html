<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我们的瞬间 · Our Moments</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #5b3a4a;
      background: linear-gradient(160deg, #fff0f3 0%, #ffe3ec 40%, #fde2ff 100%);
    }
    header {
      text-align: center;
      padding: 48px 20px 24px;
    }
    header h1 {
      font-size: 2.2em;
      letter-spacing: 2px;
      color: #c2567a;
      font-weight: 700;
    }
    header p {
      margin-top: 10px;
      font-size: 1.05em;
      color: #9b6b7d;
    }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    figure {
      margin: 0;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 8px 24px rgba(194,86,122,0.18);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    figure:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(194,86,122,0.28);
    }
    figure img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    figcaption {
      padding: 8px 12px;
      font-size: 0.9em;
      color: #8a5a6c;
      text-align: center;
    }
    .empty {
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
      color: #a9788a;
      font-size: 1.05em;
      line-height: 1.8;
    }
    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(40, 20, 30, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .lightbox .close {
      position: absolute;
      top: 18px;
      right: 26px;
      color: #fff;
      font-size: 34px;
      cursor: pointer;
      line-height: 1;
      opacity: 0.85;
    }
    .lightbox .close:hover { opacity: 1; }
    footer {
      text-align: center;
      padding: 0 20px 40px;
      font-size: 0.85em;
      color: #b58aa0;
    }
    footer a { color: #c2567a; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>我们的瞬间</h1>
    <p>Our Moments · 点点滴滴，都值得珍藏</p>
  </header>

  <main class="grid" id="grid"></main>

  <div class="empty" id="empty" style="display:none;">
    还没有照片哦～<br />
      把你们的合照放进 <code>photos/</code> 文件夹，命名为 <code>1.jpg</code>、<code>2.jpg</code>…<br />
      刷新本页就会自动出现啦。
  </div>

  <footer>
    <a href="./">返回首页</a>
  </footer>

  <div class="lightbox" id="lightbox">
    <span class="close" id="lbClose">&times;</span>
    <img id="lbImg" src="" alt="" />
  </div>

  <script>
    // 自动发现 photos/ 下的图片：1.jpg, 2.jpg ... 支持常见扩展名
    const MAX = 80;
    const exts = ["jpg", "jpeg", "png", "webp", "gif"];
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    let found = 0;

    function openLightbox(src) {
      lbImg.src = src;
      lightbox.classList.add("open");
    }
    document.getElementById("lbClose").onclick = () => lightbox.classList.remove("open");
    lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.classList.remove("open"); };

    for (let i = 1; i <= MAX; i++) {
      const figure = document.createElement("figure");
      const img = document.createElement("img");
      const cap = document.createElement("figcaption");
      cap.textContent = "照片 " + i;
      figure.appendChild(img);
      figure.appendChild(cap);
      figure.onclick = () => openLightbox(img.src);

      let k = 0;
      const tryExt = () => {
        if (k >= exts.length) { figure.remove(); return; }
        img.onerror = () => { k++; tryExt(); };
        img.onload = () => { found++; grid.appendChild(figure); };
        img.src = `photos/${i}.${exts[k]}`;
      };
      tryExt();
    }

    // 若一段时间仍无照片，提示一下
    setTimeout(() => { if (found === 0) empty.style.display = "block"; }, 1500);
  </script>
</body>
</html>
